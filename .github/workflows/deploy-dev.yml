            } >> "$GITHUB_ENV"
          done
          echo "Secrets fetched: $(jq '.secrets | length' /tmp/infisical-secrets.json)"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build Backend
        run: |
          cd backend
          dotnet restore
          dotnet publish AoDaiNhaUyen.Api -c Release -o publish --no-restore

      - name: Upload Backend Artifact to S3
        run: |
          mkdir -p ~/.aws
          cat > ~/.aws/config << EOF
          [default]
          region = $S3_REGION
          s3 =
            addressing_style = path
          EOF
          tar -czf backend-publish.tar.gz -C backend/publish .
          AWS_ACCESS_KEY_ID="$S3_ACCESS_KEY" \
          AWS_SECRET_ACCESS_KEY="$S3_SECRET_KEY" \
          AWS_REGION="$S3_REGION" \
          AWS_ENDPOINT_URL="$S3_SERVICE_URL" \
          aws s3 cp backend-publish.tar.gz "s3://$S3_BUCKET_NAME/$S3_ARTIFACT_PREFIX/backend-publish.tar.gz"

  # ==========================================
  # Build Admin Frontend for HK1
