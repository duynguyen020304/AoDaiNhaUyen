  # ==========================================
  # Deploy to HK1 Server
  # ==========================================
  deploy-hk1:
    needs: [build-frontend-hk1, build-backend, build-admin-hk1]
    runs-on: ubuntu-latest
    environment: HK1

    env:
      SERVER_NAME: "HK1"
      SSH_ALIAS: "aodai-hk1"
      S3_ARTIFACT_PREFIX: artifacts/${{ github.event.repository.name }}/${{ github.ref_name }}/${{ github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fetch secrets from Infisical
        shell: bash
        env:
          INFISICAL_TOKEN: ${{ secrets.INFISICAL_TOKEN }}
        run: |
          set -euo pipefail
          case "${INFISICAL_ENVIRONMENT_SLUG}" in
            prod|production)
              echo "ERROR: deploy-dev.yml must not fetch production Infisical secrets"
              exit 1
              ;;
          esac
          echo "Fetching Infisical secrets from environment: ${INFISICAL_ENVIRONMENT_SLUG}"
          sudo apt-get update -qq && sudo apt-get install -y -qq jq >/dev/null 2>&1
          HTTP_CODE=$(curl -sS -w "%{http_code}" -o /tmp/infisical-secrets.json \
            --connect-timeout 15 --max-time 60 --retry 5 --retry-delay 10 \
            -H "Authorization: Bearer ${INFISICAL_TOKEN}" \
            "${INFISICAL_API_URL}/api/v3/secrets/raw?projectId=${INFISICAL_PROJECT_ID}&environment=${INFISICAL_ENVIRONMENT_SLUG}&secretPath=${INFISICAL_SECRET_PATH}")
          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "ERROR: Infisical API returned HTTP $HTTP_CODE"
            cat /tmp/infisical-secrets.json
            exit 1
          fi
          jq -r '.secrets[] | [.secretKey, .secretValue // ""] | @tsv' /tmp/infisical-secrets.json |
          while IFS=$'\t' read -r key value; do
            if [ -n "$value" ]; then
              echo "::add-mask::$value"
            fi
            {
              echo "${key}<<__INFISICAL_${key}__"
              echo "$value"
              echo "__INFISICAL_${key}__"
            } >> "$GITHUB_ENV"
          done
          echo "Secrets fetched: $(jq '.secrets | length' /tmp/infisical-secrets.json)"

      - name: Map HK1 secrets to deploy variables
        shell: bash
        run: |
          set -euo pipefail
          echo "ENABLE_CLOUDFLARE_TUNNEL=${HK1_ENABLE_CLOUDFLARE_TUNNEL}" >> "$GITHUB_ENV"
          echo "RAW_CLOUDFLARE_TUNNEL_HOST=${HK1_CLOUDFLARE_TUNNEL_HOST:-}" >> "$GITHUB_ENV"
          echo "DEPLOY_HOST=${HK1_PRODUCTION_SERVER_HOST}" >> "$GITHUB_ENV"
          echo "DEPLOY_PORT=${HK1_PRODUCTION_SERVER_PORT}" >> "$GITHUB_ENV"
          echo "DEPLOY_USER=${HK1_PRODUCTION_SERVER_USER}" >> "$GITHUB_ENV"
          echo "CF_ACCESS_CLIENT_ID=${HK1_CF_ACCESS_CLIENT_ID:-}" >> "$GITHUB_ENV"
          echo "CF_ACCESS_CLIENT_SECRET=${HK1_CF_ACCESS_CLIENT_SECRET:-}" >> "$GITHUB_ENV"

      # ------------------------------------------
      # Download Artifacts from S3
      # ------------------------------------------
      - name: Configure S3 path-style addressing
        run: |
          mkdir -p ~/.aws
          cat > ~/.aws/config << EOF
          [default]
          region = $S3_REGION
          s3 =
            addressing_style = path
          EOF

      - name: Download Frontend Artifact from S3
        run: |
          mkdir -p frontend/dist
          AWS_ACCESS_KEY_ID="$S3_ACCESS_KEY" \
          AWS_SECRET_ACCESS_KEY="$S3_SECRET_KEY" \
          AWS_REGION="$S3_REGION" \
          AWS_ENDPOINT_URL="$S3_SERVICE_URL" \
          aws s3 cp "s3://$S3_BUCKET_NAME/$S3_ARTIFACT_PREFIX/frontend-dist-hk1.tar.gz" frontend-dist-hk1.tar.gz
          tar -xzf frontend-dist-hk1.tar.gz -C frontend/dist

      - name: Download Backend Publish from S3
        run: |
          mkdir -p backend/publish
          AWS_ACCESS_KEY_ID="$S3_ACCESS_KEY" \
          AWS_SECRET_ACCESS_KEY="$S3_SECRET_KEY" \
          AWS_REGION="$S3_REGION" \
          AWS_ENDPOINT_URL="$S3_SERVICE_URL" \
          aws s3 cp "s3://$S3_BUCKET_NAME/$S3_ARTIFACT_PREFIX/backend-publish.tar.gz" backend-publish.tar.gz
          tar -xzf backend-publish.tar.gz -C backend/publish

      - name: Download Admin Frontend Artifact from S3
        run: |
          mkdir -p frontend-admin/dist
          AWS_ACCESS_KEY_ID="$S3_ACCESS_KEY" \
          AWS_SECRET_ACCESS_KEY="$S3_SECRET_KEY" \
          AWS_REGION="$S3_REGION" \
          AWS_ENDPOINT_URL="$S3_SERVICE_URL" \
          aws s3 cp "s3://$S3_BUCKET_NAME/$S3_ARTIFACT_PREFIX/admin-dist-hk1.tar.gz" admin-dist-hk1.tar.gz
          tar -xzf admin-dist-hk1.tar.gz -C frontend-admin/dist

      # ------------------------------------------
      # Resolve SSH transport & prepare client tools
      # ------------------------------------------
      - name: Resolve SSH transport
        id: ssh_target
        shell: bash
        run: |
          set -euo pipefail

          enable_tunnel="$(printf '%s' "${ENABLE_CLOUDFLARE_TUNNEL}" | tr '[:upper:]' '[:lower:]')"
          native_port="${DEPLOY_PORT:-22}"

          use_tunnel="false"
          if [ "$enable_tunnel" = "true" ] || [ "$enable_tunnel" = "1" ] || [ "$enable_tunnel" = "yes" ]; then
            use_tunnel="true"
          fi

          normalize_cloudflare_hostname() {
            local raw_value="$1"
            local normalized

            normalized="$(printf '%s' "$raw_value" | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//')"
            normalized="${normalized#*://}"
            normalized="${normalized%%/*}"
            normalized="${normalized##*@}"

            if [[ "$normalized" == *:* ]]; then
              normalized="${normalized%%:*}"
            fi

            printf '%s' "$normalized"
          }

          tunnel_host="$(normalize_cloudflare_hostname "${RAW_CLOUDFLARE_TUNNEL_HOST:-}")"

          if [ "$use_tunnel" = "true" ]; then
            if [ -z "$tunnel_host" ]; then
              echo "::error::[${SERVER_NAME}] Cloudflare tunnel mode is enabled but CLOUDFLARE_TUNNEL_HOST is empty. Set it to the published tunnel hostname (for example ssh.example.com), or disable tunnel mode."
              exit 1
            fi

            if [[ "$tunnel_host" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::[${SERVER_NAME}] CLOUDFLARE_TUNNEL_HOST must be a published hostname such as ssh.example.com, not a raw server IP (${tunnel_host})."
              exit 1
            fi

            echo "connection_mode=cloudflare" >> "$GITHUB_OUTPUT"
            echo "target_host=$tunnel_host" >> "$GITHUB_OUTPUT"
            echo "target_port=22" >> "$GITHUB_OUTPUT"
            echo "[${SERVER_NAME}] Cloudflare Tunnel enabled. Using SSH hostname: $tunnel_host"
          else
            echo "connection_mode=native" >> "$GITHUB_OUTPUT"
            echo "target_host=${DEPLOY_HOST}" >> "$GITHUB_OUTPUT"
            echo "target_port=${native_port}" >> "$GITHUB_OUTPUT"
            echo "[${SERVER_NAME}] Native SSH enabled. Using ${DEPLOY_HOST}:${native_port}"
          fi

      - name: Prepare SSH client
        shell: bash
        run: |
          set -euo pipefail
          SSH_CONFIG_FILE="$HOME/.ssh/config"

          sudo apt-get update
          sudo apt-get install -y rsync openssh-client

          if [ "${{ steps.ssh_target.outputs.connection_mode }}" = "cloudflare" ]; then
            curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
            chmod +x cloudflared
            sudo mv cloudflared /usr/local/bin/cloudflared

            resolved_tunnel_host='${{ steps.ssh_target.outputs.target_host }}'
            if ! getent ahosts "$resolved_tunnel_host" >/dev/null 2>&1; then
              echo "::error::[${SERVER_NAME}] Cloudflare tunnel hostname '$resolved_tunnel_host' does not resolve from the GitHub runner. Make sure CLOUDFLARE_TUNNEL_HOST is the published Cloudflare hostname (for example ssh.example.com), not a URL, username@host, host:port, or server IP."
              exit 1
            fi

            if [ -z "${CF_ACCESS_CLIENT_ID:-}" ] || [ -z "${CF_ACCESS_CLIENT_SECRET:-}" ]; then
              echo "::warning::[${SERVER_NAME}] Cloudflare tunnel mode is enabled without CF_ACCESS_CLIENT_ID / CF_ACCESS_CLIENT_SECRET. If Cloudflare Access requires authentication, deployment may fail in GitHub Actions."
            fi
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          cat > ~/.ssh/id_github_actions << 'EOF'
          ${{ secrets.HK1_PRODUCTION_SERVER_SSH_KEY }}
          EOF
          chmod 600 ~/.ssh/id_github_actions

          cat > "$SSH_CONFIG_FILE" << EOF
          Host ${SSH_ALIAS}
            HostName ${{ steps.ssh_target.outputs.target_host }}
            User ${DEPLOY_USER}
            Port ${{ steps.ssh_target.outputs.target_port }}
            IdentityFile ~/.ssh/id_github_actions
            IdentitiesOnly yes
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            ServerAliveInterval 30
            ServerAliveCountMax 120
          EOF
          chmod 600 "$SSH_CONFIG_FILE"

          if [ "${{ steps.ssh_target.outputs.connection_mode }}" = "cloudflare" ]; then
            if [ -n "${CF_ACCESS_CLIENT_ID:-}" ] && [ -n "${CF_ACCESS_CLIENT_SECRET:-}" ]; then
              printf '  ProxyCommand /usr/local/bin/cloudflared access ssh --hostname %%h --service-token-id %q --service-token-secret %q\n' "${CF_ACCESS_CLIENT_ID}" "${CF_ACCESS_CLIENT_SECRET}" >> "$SSH_CONFIG_FILE"
              echo "[${SERVER_NAME}] Using Cloudflare Access service token for SSH authentication."
            else
              cat >> "$SSH_CONFIG_FILE" << 'EOF'
            ProxyCommand /usr/local/bin/cloudflared access ssh --hostname %h
          EOF
              echo "::warning::[${SERVER_NAME}] Cloudflare tunnel mode is enabled without a service token in the SSH proxy command. cloudflared will attempt interactive browser authentication, which usually fails in CI."
            fi
            cloudflared --version
          fi

      - name: Verify SSH connectivity
        shell: bash
        run: |
          set -euo pipefail
          SSH_CONFIG_FILE="$HOME/.ssh/config"
          echo "[${SERVER_NAME}] Testing SSH connectivity..."
          timeout 60s ssh -F "$SSH_CONFIG_FILE" -o BatchMode=yes -o ConnectTimeout=30 ${SSH_ALIAS} 'echo "[${SERVER_NAME}] Connected to $(hostname)"'

      # ------------------------------------------
      # Deploy to Server
      # ------------------------------------------
      - name: Deploy Frontend to Server
        shell: bash
        run: |
          set -euo pipefail
          SSH_CONFIG_FILE="$HOME/.ssh/config"
          echo "[${SERVER_NAME}] Deploying frontend..."
          rsync -avzr --delete -e "ssh -F $SSH_CONFIG_FILE" frontend/dist/ ${SSH_ALIAS}:/tmp/aodai-frontend-deploy

      - name: Deploy Admin Frontend to Server
        shell: bash
        run: |
          set -euo pipefail
          SSH_CONFIG_FILE="$HOME/.ssh/config"
          echo "[${SERVER_NAME}] Deploying admin frontend..."
          rsync -avzr --delete -e "ssh -F $SSH_CONFIG_FILE" frontend-admin/dist/ ${SSH_ALIAS}:/tmp/aodai-admin-deploy

      - name: Deploy Backend to Server
        shell: bash
        run: |
          set -euo pipefail
          SSH_CONFIG_FILE="$HOME/.ssh/config"
          echo "[${SERVER_NAME}] Deploying backend..."
          rsync -avzr --delete -e "ssh -F $SSH_CONFIG_FILE" backend/publish/ ${SSH_ALIAS}:/tmp/aodai-backend-deploy

      # ------------------------------------------
      # Prepare runtime environment files
      # ------------------------------------------
      - name: Generate runtime-env.sh for HK1
        shell: bash
        run: |
          cat > /tmp/runtime-env-hk1.sh << RUNTIMEEOF
          export ASPNETCORE_ENVIRONMENT='Production'
          export ASPNETCORE_URLS='http://localhost:${HK1_BACKEND_PORT}'
          export ConnectionStrings__DefaultConnection='${HK1_POSTGRESQL_CONNECTION_STRING}'
          export RunMigrationsAndSeedOnStartup='${HK1_RUN_MIGRATIONS_AND_SEED_ON_STARTUP}'
          export JwtSettings__SecretKey='${HK1_JWT_SECRET_KEY}'
          export JwtSettings__Issuer='${HK1_JWT_ISSUER:-AoDaiNhaUyen.Api}'
          export JwtSettings__Audience='${HK1_JWT_AUDIENCE:-AoDaiNhaUyen.Frontend}'
          export JwtSettings__ExpiryMinutes='${HK1_JWT_EXPIRY_MINUTES:-60}'
          export JwtSettings__RefreshTokenExpiryDays='${HK1_JWT_REFRESH_TOKEN_EXPIRY_DAYS:-30}'
          export CookieSettings__AccessTokenCookieName='${HK1_COOKIE_ACCESS_TOKEN_COOKIE_NAME:-access_token}'
          export CookieSettings__RefreshTokenCookieName='${HK1_COOKIE_REFRESH_TOKEN_COOKIE_NAME:-refresh_token}'
          export ConnectionStrings__Redis='${HK1_REDIS_CONNECTION_STRING:-}'
          export GoogleOAuth__ClientId='${HK1_GOOGLE_OAUTH_CLIENT_ID}'
          export GoogleOAuth__ClientSecret='${HK1_GOOGLE_OAUTH_CLIENT_SECRET}'
          export GoogleOAuth__RedirectUri='${HK1_GOOGLE_OAUTH_REDIRECT_URI}'
          export ZaloOAuth__AppId='${HK1_ZALO_OAUTH_APP_ID}'
          export ZaloOAuth__SecretKey='${HK1_ZALO_OAUTH_SECRET_KEY}'
          export ZaloOAuth__RedirectUri='${HK1_ZALO_OAUTH_REDIRECT_URI}'
          export EmailSettings__SmtpHost='${HK1_EMAIL_SMTP_HOST}'
          export EmailSettings__SmtpPort='${HK1_EMAIL_SMTP_PORT}'
          export EmailSettings__SmtpUsername='${HK1_EMAIL_SMTP_USERNAME}'
          export EmailSettings__SmtpPassword='${HK1_EMAIL_SMTP_PASSWORD}'
          export EmailSettings__EnableSsl='${HK1_EMAIL_ENABLE_SSL}'
          export EmailSettings__FromEmail='${HK1_EMAIL_FROM_EMAIL}'
          export EmailSettings__FromName='${HK1_EMAIL_FROM_NAME}'
          export EmailSettings__ApiBaseUrl='${HK1_EMAIL_API_BASE_URL}'
          export EmailSettings__FrontendBaseUrl='${HK1_EMAIL_FRONTEND_BASE_URL}'
          export GoogleCloud__ProjectId='${HK1_GCLOUD_PROJECT_ID}'
          export GoogleCloud__ApiKey='${HK1_GCLOUD_API_KEY}'
          export GoogleCloud__Location='${HK1_GCLOUD_LOCATION}'
          export GoogleCloud__VirtualTryOnModel='${HK1_GCLOUD_MODEL}'
          export GoogleCloud__StylistTextModel='${HK1_GCLOUD_STYLIST_TEXT_MODEL}'
          export GoogleCloud__TimeoutSeconds='${HK1_GCLOUD_TIMEOUT_SECONDS}'
          export CacheSettings__Version='${HK1_CACHE_SETTINGS_VERSION}'
          export FrontendOrigins='${HK1_FRONTEND_ORIGINS}'
          export S3Storage__BucketName='${S3_BUCKET_NAME}'
          export S3Storage__Region='${S3_REGION}'
          export S3Storage__AccessKey='${S3_ACCESS_KEY}'
          export S3Storage__SecretKey='${S3_SECRET_KEY}'
          export S3Storage__ServiceUrl='${S3_SERVICE_URL}'
          export S3Storage__UsePathStyle='${S3_USE_PATH_STYLE}'
          export Hermes__AdminApiKey='${HK1_HERMES_ADMIN_API_KEY:-}'
          export Hermes__ApiServerUrl='${HK1_HERMES_API_SERVER_URL:-http://127.0.0.1:8642}'
          export Hermes__ApiServerKey='${HK1_HERMES_API_SERVER_KEY:-}'
          export Hermes__RunnerName='${HK1_HERMES_RUNNER_NAME:-aodai-admin-hermes}'
          export AdminSeed__Email='${HK1_ADMIN_SEED_EMAIL}'
          export AdminSeed__Password='${HK1_ADMIN_SEED_PASSWORD}'
          RUNTIMEEOF
          chmod 600 /tmp/runtime-env-hk1.sh

      - name: Deploy Runtime Env to Server
        shell: bash
        run: |
          set -euo pipefail
          SSH_CONFIG_FILE="$HOME/.ssh/config"
          rsync -avz -e "ssh -F $SSH_CONFIG_FILE" /tmp/runtime-env-hk1.sh ${SSH_ALIAS}:/tmp/runtime-env.sh

      # ------------------------------------------
      # Finalize Deployment & Restart Services
      # ------------------------------------------
      - name: Finalize Deployment via SSH
        shell: bash
        run: |
          set -euo pipefail
          SSH_CONFIG_FILE="$HOME/.ssh/config"
          ssh -F "$SSH_CONFIG_FILE" ${SSH_ALIAS} 'bash -se' << 'REMOTE_SCRIPT'
          set -e

          source ~/.bashrc 2>/dev/null || true
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh" 2>/dev/null || true

          SERVER_NAME="${SERVER_NAME}"
          echo "=== [${SERVER_NAME}] Starting Deployment ==="

          # ==========================================
          # 1. Setup .NET Runtime
          # ==========================================
          if ! command -v dotnet &> /dev/null; then
            echo "[${SERVER_NAME}] Installing .NET runtime..."
            wget https://dot.net/v1/dotnet-install.sh -O dotnet-install.sh
            chmod +x dotnet-install.sh
            ./dotnet-install.sh --channel 10.0 --install-dir /usr/share/dotnet
            export PATH="$PATH:/usr/share/dotnet"
            echo 'export PATH="$PATH:/usr/share/dotnet"' >> ~/.bashrc
          fi

          DOTNET_PATH=$(which dotnet || echo "/usr/share/dotnet/dotnet")
          echo "[${SERVER_NAME}] Dotnet path: $DOTNET_PATH"

          # ==========================================
          # 2. Ensure Deployment Directories Exist
          # ==========================================
          mkdir -p /root/AoDaiNhaUyen/frontend
          mkdir -p /root/AoDaiNhaUyen/backend

          # ==========================================
          # 3. Install runtime-env.sh
          # ==========================================
          echo "[${SERVER_NAME}] Installing runtime-env.sh..."
          cp /tmp/runtime-env.sh /root/AoDaiNhaUyen/backend/runtime-env.sh
          chmod 600 /root/AoDaiNhaUyen/backend/runtime-env.sh

          # ==========================================
          # 4. Stop PM2 Processes
          # ==========================================
          echo "[${SERVER_NAME}] Stopping PM2 processes..."
          /root/.bun/bin/pm2 stop aodai-api 2>/dev/null || true
          /root/.bun/bin/pm2 stop aodai-admin 2>/dev/null || true
          /root/.bun/bin/pm2 stop aodai-frontend 2>/dev/null || true

          # ==========================================
          # 5. Ensure serve is installed
          # ==========================================
          if ! /root/.bun/bin/bun pm ls -g 2>/dev/null | grep -q serve; then
            echo "[${SERVER_NAME}] Installing serve..."
            /root/.bun/bin/bun add -g serve
          fi

          # ==========================================
          # 6. Deploy Frontend
          # ==========================================
          echo "[${SERVER_NAME}] Deploying Frontend..."
          cd /root/AoDaiNhaUyen/frontend
          if [ -d "dist" ]; then
            mv dist dist.backup.$(date +%Y%m%d_%H%M%S) || true
          fi
          mv /tmp/aodai-frontend-deploy dist
          rm -rf /tmp/aodai-frontend-deploy

          # ==========================================
          # 6b. Deploy Admin Frontend
          # ==========================================
          echo "[${SERVER_NAME}] Deploying Admin Frontend..."
          mkdir -p /root/AoDaiNhaUyen/frontend-admin
          cd /root/AoDaiNhaUyen/frontend-admin
          if [ -d "dist" ]; then
            mv dist dist.backup.$(date +%Y%m%d_%H%M%S) || true
          fi
          mv /tmp/aodai-admin-deploy dist
          rm -rf /tmp/aodai-admin-deploy

          # ==========================================
          # 7. Deploy Backend
          # ==========================================
          echo "[${SERVER_NAME}] Deploying Backend..."
          cd /root/AoDaiNhaUyen/backend
          if [ -f "AoDaiNhaUyen.Api.dll" ]; then
            mkdir -p publish.backup
            cp *.dll *.json *.deps.json publish.backup/ 2>/dev/null || true
          fi
          rm -rf *.dll *.json *.deps.json 2>/dev/null || true
          cp -r /tmp/aodai-backend-deploy/* .
          rm -rf /tmp/aodai-backend-deploy

          if [ -f appsettings.Production.json ]; then
            cp appsettings.Production.json appsettings.Production.json.bak
          fi

          cat > /root/AoDaiNhaUyen/backend/start.sh << EOF
          #!/bin/bash
          set -a
          . /root/AoDaiNhaUyen/backend/runtime-env.sh
          set +a
          cd /root/AoDaiNhaUyen/backend
          ASPNETCORE_ENVIRONMENT=Production $DOTNET_PATH AoDaiNhaUyen.Api.dll
          EOF
          chmod +x /root/AoDaiNhaUyen/backend/start.sh

          cat > /root/AoDaiNhaUyen/frontend/start.sh << 'STARTEOF'
          #!/bin/bash
          cd /root/AoDaiNhaUyen/frontend/dist
          /root/.bun/bin/serve -s -l 3000 .
          STARTEOF
          chmod +x /root/AoDaiNhaUyen/frontend/start.sh

          cat > /root/AoDaiNhaUyen/frontend-admin/start.sh << 'STARTEOF'
          #!/bin/bash
          cd /root/AoDaiNhaUyen/frontend-admin/dist
          /root/.bun/bin/serve -s -l 3101 .
          STARTEOF
          chmod +x /root/AoDaiNhaUyen/frontend-admin/start.sh

          # ==========================================
          # 8. Restart PM2 Processes
          # ==========================================
          echo "[${SERVER_NAME}] Restarting PM2 processes..."
          /root/.bun/bin/pm2 delete aodai-api 2>/dev/null || true
          /root/.bun/bin/pm2 delete aodai-admin 2>/dev/null || true
          /root/.bun/bin/pm2 delete aodai-frontend 2>/dev/null || true

          /root/.bun/bin/pm2 start /root/AoDaiNhaUyen/backend/start.sh --name "aodai-api"
          /root/.bun/bin/pm2 start /root/AoDaiNhaUyen/frontend/start.sh --name "aodai-frontend"
          /root/.bun/bin/pm2 start /root/AoDaiNhaUyen/frontend-admin/start.sh --name "aodai-admin"

          /root/.bun/bin/pm2 save

          # ==========================================
          # 9. Cleanup
          # ==========================================
          echo "[${SERVER_NAME}] Cleaning up old backups..."
          cd /root/AoDaiNhaUyen/frontend
          ls -dt dist.backup.* 2>/dev/null | tail -n +4 | xargs rm -rf 2>/dev/null || true

          cd /root/AoDaiNhaUyen/backend
          rm -rf publish.backup 2>/dev/null || true

          echo "=== [${SERVER_NAME}] Deployment Completed Successfully ==="

          /root/.bun/bin/pm2 status
          REMOTE_SCRIPT

  # ==========================================
  # Deploy to US1 Server
  # ==========================================
  deploy-us1:
    needs: [build-frontend-us1, build-backend, build-admin-us1]
    runs-on: ubuntu-latest
    environment: US1

    env:
      SERVER_NAME: "US1"
      SSH_ALIAS: "aodai-us1"
      S3_ARTIFACT_PREFIX: artifacts/${{ github.event.repository.name }}/${{ github.ref_name }}/${{ github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fetch secrets from Infisical
        shell: bash
        env:
          INFISICAL_TOKEN: ${{ secrets.INFISICAL_TOKEN }}
        run: |
          set -euo pipefail
          case "${INFISICAL_ENVIRONMENT_SLUG}" in
            prod|production)
              echo "ERROR: deploy-dev.yml must not fetch production Infisical secrets"
              exit 1
              ;;
          esac
          echo "Fetching Infisical secrets from environment: ${INFISICAL_ENVIRONMENT_SLUG}"
          sudo apt-get update -qq && sudo apt-get install -y -qq jq >/dev/null 2>&1
          HTTP_CODE=$(curl -sS -w "%{http_code}" -o /tmp/infisical-secrets.json \
            --connect-timeout 15 --max-time 60 --retry 5 --retry-delay 10 \
            -H "Authorization: Bearer ${INFISICAL_TOKEN}" \
            "${INFISICAL_API_URL}/api/v3/secrets/raw?projectId=${INFISICAL_PROJECT_ID}&environment=${INFISICAL_ENVIRONMENT_SLUG}&secretPath=${INFISICAL_SECRET_PATH}")
          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "ERROR: Infisical API returned HTTP $HTTP_CODE"
            cat /tmp/infisical-secrets.json
            exit 1
          fi
          jq -r '.secrets[] | [.secretKey, .secretValue // ""] | @tsv' /tmp/infisical-secrets.json |
          while IFS=$'\t' read -r key value; do
            if [ -n "$value" ]; then
              echo "::add-mask::$value"
            fi
            {
              echo "${key}<<__INFISICAL_${key}__"
              echo "$value"
              echo "__INFISICAL_${key}__"
            } >> "$GITHUB_ENV"
          done
          echo "Secrets fetched: $(jq '.secrets | length' /tmp/infisical-secrets.json)"

      - name: Map US1 secrets to deploy variables
        shell: bash
        run: |
          set -euo pipefail
          echo "ENABLE_CLOUDFLARE_TUNNEL=${US1_ENABLE_CLOUDFLARE_TUNNEL}" >> "$GITHUB_ENV"
          echo "RAW_CLOUDFLARE_TUNNEL_HOST=${US1_CLOUDFLARE_TUNNEL_HOST:-}" >> "$GITHUB_ENV"
          echo "DEPLOY_HOST=${US1_PRODUCTION_SERVER_HOST}" >> "$GITHUB_ENV"
          echo "DEPLOY_PORT=${US1_PRODUCTION_SERVER_PORT}" >> "$GITHUB_ENV"
          echo "DEPLOY_USER=${US1_PRODUCTION_SERVER_USER}" >> "$GITHUB_ENV"
          echo "CF_ACCESS_CLIENT_ID=${US1_CF_ACCESS_CLIENT_ID:-}" >> "$GITHUB_ENV"
          echo "CF_ACCESS_CLIENT_SECRET=${US1_CF_ACCESS_CLIENT_SECRET:-}" >> "$GITHUB_ENV"

      # ------------------------------------------
      # Download Artifacts from S3
      # ------------------------------------------
      - name: Configure S3 path-style addressing
        run: |
          mkdir -p ~/.aws
          cat > ~/.aws/config << EOF
          [default]
          region = $S3_REGION
          s3 =
            addressing_style = path
          EOF

      - name: Download Frontend Artifact from S3
        run: |
          mkdir -p frontend/dist
          AWS_ACCESS_KEY_ID="$S3_ACCESS_KEY" \
          AWS_SECRET_ACCESS_KEY="$S3_SECRET_KEY" \
          AWS_REGION="$S3_REGION" \
          AWS_ENDPOINT_URL="$S3_SERVICE_URL" \
          aws s3 cp "s3://$S3_BUCKET_NAME/$S3_ARTIFACT_PREFIX/frontend-dist-us1.tar.gz" frontend-dist-us1.tar.gz
          tar -xzf frontend-dist-us1.tar.gz -C frontend/dist

      - name: Download Backend Publish from S3
        run: |
          mkdir -p backend/publish
          AWS_ACCESS_KEY_ID="$S3_ACCESS_KEY" \
          AWS_SECRET_ACCESS_KEY="$S3_SECRET_KEY" \
          AWS_REGION="$S3_REGION" \
          AWS_ENDPOINT_URL="$S3_SERVICE_URL" \
          aws s3 cp "s3://$S3_BUCKET_NAME/$S3_ARTIFACT_PREFIX/backend-publish.tar.gz" backend-publish.tar.gz
          tar -xzf backend-publish.tar.gz -C backend/publish

      - name: Download Admin Frontend Artifact from S3
        run: |
          mkdir -p frontend-admin/dist
          AWS_ACCESS_KEY_ID="$S3_ACCESS_KEY" \
          AWS_SECRET_ACCESS_KEY="$S3_SECRET_KEY" \
          AWS_REGION="$S3_REGION" \
          AWS_ENDPOINT_URL="$S3_SERVICE_URL" \
          aws s3 cp "s3://$S3_BUCKET_NAME/$S3_ARTIFACT_PREFIX/admin-dist-us1.tar.gz" admin-dist-us1.tar.gz
          tar -xzf admin-dist-us1.tar.gz -C frontend-admin/dist

      # ------------------------------------------
      # Resolve SSH transport & prepare client tools
      # ------------------------------------------
      - name: Resolve SSH transport
        id: ssh_target
        shell: bash
        run: |
          set -euo pipefail

          enable_tunnel="$(printf '%s' "${ENABLE_CLOUDFLARE_TUNNEL}" | tr '[:upper:]' '[:lower:]')"
          native_port="${DEPLOY_PORT:-22}"

          use_tunnel="false"
          if [ "$enable_tunnel" = "true" ] || [ "$enable_tunnel" = "1" ] || [ "$enable_tunnel" = "yes" ]; then
            use_tunnel="true"
          fi

          normalize_cloudflare_hostname() {
            local raw_value="$1"
            local normalized

            normalized="$(printf '%s' "$raw_value" | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//')"
            normalized="${normalized#*://}"
            normalized="${normalized%%/*}"
            normalized="${normalized##*@}"

            if [[ "$normalized" == *:* ]]; then
              normalized="${normalized%%:*}"
            fi

            printf '%s' "$normalized"
          }

          tunnel_host="$(normalize_cloudflare_hostname "${RAW_CLOUDFLARE_TUNNEL_HOST:-}")"

          if [ "$use_tunnel" = "true" ]; then
            if [ -z "$tunnel_host" ]; then
              echo "::error::[${SERVER_NAME}] Cloudflare tunnel mode is enabled but CLOUDFLARE_TUNNEL_HOST is empty. Set it to the published tunnel hostname (for example ssh.example.com), or disable tunnel mode."
              exit 1
            fi

            if [[ "$tunnel_host" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::[${SERVER_NAME}] CLOUDFLARE_TUNNEL_HOST must be a published hostname such as ssh.example.com, not a raw server IP (${tunnel_host})."
              exit 1
            fi

            echo "connection_mode=cloudflare" >> "$GITHUB_OUTPUT"
            echo "target_host=$tunnel_host" >> "$GITHUB_OUTPUT"
            echo "target_port=22" >> "$GITHUB_OUTPUT"
            echo "[${SERVER_NAME}] Cloudflare Tunnel enabled. Using SSH hostname: $tunnel_host"
          else
            echo "connection_mode=native" >> "$GITHUB_OUTPUT"
            echo "target_host=${DEPLOY_HOST}" >> "$GITHUB_OUTPUT"
            echo "target_port=${native_port}" >> "$GITHUB_OUTPUT"
            echo "[${SERVER_NAME}] Native SSH enabled. Using ${DEPLOY_HOST}:${native_port}"
          fi

      - name: Prepare SSH client
        shell: bash
        run: |
          set -euo pipefail
          SSH_CONFIG_FILE="$HOME/.ssh/config"

          sudo apt-get update
          sudo apt-get install -y rsync openssh-client

          if [ "${{ steps.ssh_target.outputs.connection_mode }}" = "cloudflare" ]; then
            curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
            chmod +x cloudflared
            sudo mv cloudflared /usr/local/bin/cloudflared

            resolved_tunnel_host='${{ steps.ssh_target.outputs.target_host }}'
            if ! getent ahosts "$resolved_tunnel_host" >/dev/null 2>&1; then
              echo "::error::[${SERVER_NAME}] Cloudflare tunnel hostname '$resolved_tunnel_host' does not resolve from the GitHub runner. Make sure CLOUDFLARE_TUNNEL_HOST is the published Cloudflare hostname (for example ssh.example.com), not a URL, username@host, host:port, or server IP."
              exit 1
            fi

            if [ -z "${CF_ACCESS_CLIENT_ID:-}" ] || [ -z "${CF_ACCESS_CLIENT_SECRET:-}" ]; then
              echo "::warning::[${SERVER_NAME}] Cloudflare tunnel mode is enabled without CF_ACCESS_CLIENT_ID / CF_ACCESS_CLIENT_SECRET. If Cloudflare Access requires authentication, deployment may fail in GitHub Actions."
            fi
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          cat > ~/.ssh/id_github_actions << 'EOF'
          ${{ secrets.US1_PRODUCTION_SERVER_SSH_KEY }}
          EOF
          chmod 600 ~/.ssh/id_github_actions

          cat > "$SSH_CONFIG_FILE" << EOF
          Host ${SSH_ALIAS}
            HostName ${{ steps.ssh_target.outputs.target_host }}
            User ${DEPLOY_USER}
            Port ${{ steps.ssh_target.outputs.target_port }}
            IdentityFile ~/.ssh/id_github_actions
            IdentitiesOnly yes
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            ServerAliveInterval 30
            ServerAliveCountMax 120
          EOF
          chmod 600 "$SSH_CONFIG_FILE"

          if [ "${{ steps.ssh_target.outputs.connection_mode }}" = "cloudflare" ]; then
            if [ -n "${CF_ACCESS_CLIENT_ID:-}" ] && [ -n "${CF_ACCESS_CLIENT_SECRET:-}" ]; then
              printf '  ProxyCommand /usr/local/bin/cloudflared access ssh --hostname %%h --service-token-id %q --service-token-secret %q\n' "${CF_ACCESS_CLIENT_ID}" "${CF_ACCESS_CLIENT_SECRET}" >> "$SSH_CONFIG_FILE"
              echo "[${SERVER_NAME}] Using Cloudflare Access service token for SSH authentication."
            else
              cat >> "$SSH_CONFIG_FILE" << 'EOF'
            ProxyCommand /usr/local/bin/cloudflared access ssh --hostname %h
          EOF
              echo "::warning::[${SERVER_NAME}] Cloudflare tunnel mode is enabled without a service token in the SSH proxy command. cloudflared will attempt interactive browser authentication, which usually fails in CI."
            fi
            cloudflared --version
          fi

      - name: Verify SSH connectivity
        shell: bash
        run: |
          set -euo pipefail
          SSH_CONFIG_FILE="$HOME/.ssh/config"
          echo "[${SERVER_NAME}] Testing SSH connectivity..."
          timeout 60s ssh -F "$SSH_CONFIG_FILE" -o BatchMode=yes -o ConnectTimeout=30 ${SSH_ALIAS} 'echo "[${SERVER_NAME}] Connected to $(hostname)"'

      # ------------------------------------------
      # Deploy to Server
      # ------------------------------------------
      - name: Deploy Frontend to Server
        shell: bash
        run: |
          set -euo pipefail
          SSH_CONFIG_FILE="$HOME/.ssh/config"
          echo "[${SERVER_NAME}] Deploying frontend..."
          rsync -avzr --delete -e "ssh -F $SSH_CONFIG_FILE" frontend/dist/ ${SSH_ALIAS}:/tmp/aodai-frontend-deploy

      - name: Deploy Admin Frontend to Server
        shell: bash
        run: |
          set -euo pipefail
          SSH_CONFIG_FILE="$HOME/.ssh/config"
          echo "[${SERVER_NAME}] Deploying admin frontend..."
          rsync -avzr --delete -e "ssh -F $SSH_CONFIG_FILE" frontend-admin/dist/ ${SSH_ALIAS}:/tmp/aodai-admin-deploy

      - name: Deploy Backend to Server
        shell: bash
        run: |
          set -euo pipefail
          SSH_CONFIG_FILE="$HOME/.ssh/config"
          echo "[${SERVER_NAME}] Deploying backend..."
          rsync -avzr --delete -e "ssh -F $SSH_CONFIG_FILE" backend/publish/ ${SSH_ALIAS}:/tmp/aodai-backend-deploy

      # ------------------------------------------
      # Prepare runtime environment files
      # ------------------------------------------
      - name: Generate runtime-env.sh for US1
        shell: bash
        run: |
          cat > /tmp/runtime-env-us1.sh << RUNTIMEEOF
          export ASPNETCORE_ENVIRONMENT='Production'
          export ASPNETCORE_URLS='http://localhost:${US1_BACKEND_PORT}'
          export ConnectionStrings__DefaultConnection='${US1_POSTGRESQL_CONNECTION_STRING}'
          export RunMigrationsAndSeedOnStartup='${US1_RUN_MIGRATIONS_AND_SEED_ON_STARTUP}'
          export JwtSettings__SecretKey='${US1_JWT_SECRET_KEY}'
          export JwtSettings__Issuer='${US1_JWT_ISSUER:-AoDaiNhaUyen.Api}'
          export JwtSettings__Audience='${US1_JWT_AUDIENCE:-AoDaiNhaUyen.Frontend}'
          export JwtSettings__ExpiryMinutes='${US1_JWT_EXPIRY_MINUTES:-60}'
          export JwtSettings__RefreshTokenExpiryDays='${US1_JWT_REFRESH_TOKEN_EXPIRY_DAYS:-30}'
          export CookieSettings__AccessTokenCookieName='${US1_COOKIE_ACCESS_TOKEN_COOKIE_NAME:-access_token}'
          export CookieSettings__RefreshTokenCookieName='${US1_COOKIE_REFRESH_TOKEN_COOKIE_NAME:-refresh_token}'
          export ConnectionStrings__Redis='${US1_REDIS_CONNECTION_STRING:-}'
          export GoogleOAuth__ClientId='${US1_GOOGLE_OAUTH_CLIENT_ID}'
          export GoogleOAuth__ClientSecret='${US1_GOOGLE_OAUTH_CLIENT_SECRET}'
          export GoogleOAuth__RedirectUri='${US1_GOOGLE_OAUTH_REDIRECT_URI}'
          export ZaloOAuth__AppId='${US1_ZALO_OAUTH_APP_ID}'
          export ZaloOAuth__SecretKey='${US1_ZALO_OAUTH_SECRET_KEY}'
          export ZaloOAuth__RedirectUri='${US1_ZALO_OAUTH_REDIRECT_URI}'
          export EmailSettings__SmtpHost='${US1_EMAIL_SMTP_HOST}'
          export EmailSettings__SmtpPort='${US1_EMAIL_SMTP_PORT}'
          export EmailSettings__SmtpUsername='${US1_EMAIL_SMTP_USERNAME}'
          export EmailSettings__SmtpPassword='${US1_EMAIL_SMTP_PASSWORD}'
          export EmailSettings__EnableSsl='${US1_EMAIL_ENABLE_SSL}'
          export EmailSettings__FromEmail='${US1_EMAIL_FROM_EMAIL}'
          export EmailSettings__FromName='${US1_EMAIL_FROM_NAME}'
          export EmailSettings__ApiBaseUrl='${US1_EMAIL_API_BASE_URL}'
          export EmailSettings__FrontendBaseUrl='${US1_EMAIL_FRONTEND_BASE_URL}'
          export GoogleCloud__ProjectId='${US1_GCLOUD_PROJECT_ID}'
          export GoogleCloud__ApiKey='${US1_GCLOUD_API_KEY}'
          export GoogleCloud__Location='${US1_GCLOUD_LOCATION}'
          export GoogleCloud__VirtualTryOnModel='${US1_GCLOUD_MODEL}'
          export GoogleCloud__StylistTextModel='${US1_GCLOUD_STYLIST_TEXT_MODEL}'
          export GoogleCloud__TimeoutSeconds='${US1_GCLOUD_TIMEOUT_SECONDS}'
          export CacheSettings__Version='${US1_CACHE_SETTINGS_VERSION}'
          export FrontendOrigins='${US1_FRONTEND_ORIGINS}'
          export S3Storage__BucketName='${S3_BUCKET_NAME}'
          export S3Storage__Region='${S3_REGION}'
          export S3Storage__AccessKey='${S3_ACCESS_KEY}'
          export S3Storage__SecretKey='${S3_SECRET_KEY}'
          export S3Storage__ServiceUrl='${S3_SERVICE_URL}'
          export S3Storage__UsePathStyle='${S3_USE_PATH_STYLE}'
          export Hermes__AdminApiKey='${US1_HERMES_ADMIN_API_KEY:-}'
          export Hermes__ApiServerUrl='${US1_HERMES_API_SERVER_URL:-http://127.0.0.1:8642}'
          export Hermes__ApiServerKey='${US1_HERMES_API_SERVER_KEY:-}'
          export Hermes__RunnerName='${US1_HERMES_RUNNER_NAME:-aodai-admin-hermes}'
          export AdminSeed__Email='${US1_ADMIN_SEED_EMAIL}'
          export AdminSeed__Password='${US1_ADMIN_SEED_PASSWORD}'
          RUNTIMEEOF
          chmod 600 /tmp/runtime-env-us1.sh

      - name: Deploy Runtime Env to Server
        shell: bash
        run: |
          set -euo pipefail
          SSH_CONFIG_FILE="$HOME/.ssh/config"
          rsync -avz -e "ssh -F $SSH_CONFIG_FILE" /tmp/runtime-env-us1.sh ${SSH_ALIAS}:/tmp/runtime-env.sh

      # ------------------------------------------
      # Finalize Deployment & Restart Services
      # ------------------------------------------
      - name: Finalize Deployment via SSH
        shell: bash
        run: |
          set -euo pipefail
          SSH_CONFIG_FILE="$HOME/.ssh/config"
          ssh -F "$SSH_CONFIG_FILE" ${SSH_ALIAS} 'bash -se' << 'REMOTE_SCRIPT'
          set -e

          source ~/.bashrc 2>/dev/null || true
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh" 2>/dev/null || true

          SERVER_NAME="${SERVER_NAME}"
          echo "=== [${SERVER_NAME}] Starting Deployment ==="

          # ==========================================
          # 1. Setup .NET Runtime
          # ==========================================
          if ! command -v dotnet &> /dev/null; then
            echo "[${SERVER_NAME}] Installing .NET runtime..."
            wget https://dot.net/v1/dotnet-install.sh -O dotnet-install.sh
            chmod +x dotnet-install.sh
            ./dotnet-install.sh --channel 10.0 --install-dir /usr/share/dotnet
            export PATH="$PATH:/usr/share/dotnet"
            echo 'export PATH="$PATH:/usr/share/dotnet"' >> ~/.bashrc
          fi

          DOTNET_PATH=$(which dotnet || echo "/usr/share/dotnet/dotnet")
          echo "[${SERVER_NAME}] Dotnet path: $DOTNET_PATH"

          # ==========================================
          # 2. Ensure Deployment Directories Exist
          # ==========================================
          mkdir -p /root/AoDaiNhaUyen/frontend
          mkdir -p /root/AoDaiNhaUyen/frontend-admin
          mkdir -p /root/AoDaiNhaUyen/backend

          # ==========================================
          # 3. Install runtime-env.sh
          # ==========================================
          echo "[${SERVER_NAME}] Installing runtime-env.sh..."
          cp /tmp/runtime-env.sh /root/AoDaiNhaUyen/backend/runtime-env.sh
          chmod 600 /root/AoDaiNhaUyen/backend/runtime-env.sh

          # ==========================================
          # 4. Stop PM2 Processes
          # ==========================================
          echo "[${SERVER_NAME}] Stopping PM2 processes..."
          /root/.bun/bin/pm2 stop aodai-api 2>/dev/null || true
          /root/.bun/bin/pm2 stop aodai-admin 2>/dev/null || true
          /root/.bun/bin/pm2 stop aodai-frontend 2>/dev/null || true

          # ==========================================
          # 5. Ensure serve is installed
          # ==========================================
          if ! /root/.bun/bin/bun pm ls -g 2>/dev/null | grep -q serve; then
            echo "[${SERVER_NAME}] Installing serve..."
            /root/.bun/bin/bun add -g serve
          fi

          # ==========================================
          # 6. Deploy Frontend
          # ==========================================
          echo "[${SERVER_NAME}] Deploying Frontend..."
          cd /root/AoDaiNhaUyen/frontend
          if [ -d "dist" ]; then
            mv dist dist.backup.$(date +%Y%m%d_%H%M%S) || true
          fi
          mv /tmp/aodai-frontend-deploy dist
          rm -rf /tmp/aodai-frontend-deploy

          # ==========================================
          # 6b. Deploy Admin Frontend
          # ==========================================
          echo "[${SERVER_NAME}] Deploying Admin Frontend..."
          mkdir -p /root/AoDaiNhaUyen/frontend-admin
          cd /root/AoDaiNhaUyen/frontend-admin
          if [ -d "dist" ]; then
            mv dist dist.backup.$(date +%Y%m%d_%H%M%S) || true
          fi
          mv /tmp/aodai-admin-deploy dist
          rm -rf /tmp/aodai-admin-deploy

          # ==========================================
          # 7. Deploy Backend
          # ==========================================
          echo "[${SERVER_NAME}] Deploying Backend..."
          cd /root/AoDaiNhaUyen/backend
          if [ -f "AoDaiNhaUyen.Api.dll" ]; then
            mkdir -p publish.backup
            cp *.dll *.json *.deps.json publish.backup/ 2>/dev/null || true
          fi
          rm -rf *.dll *.json *.deps.json 2>/dev/null || true
          cp -r /tmp/aodai-backend-deploy/* .
          rm -rf /tmp/aodai-backend-deploy

          if [ -f appsettings.Production.json ]; then
            cp appsettings.Production.json appsettings.Production.json.bak
          fi

          cat > /root/AoDaiNhaUyen/backend/start.sh << EOF
          #!/bin/bash
          set -a
          . /root/AoDaiNhaUyen/backend/runtime-env.sh
          set +a
          cd /root/AoDaiNhaUyen/backend
          ASPNETCORE_ENVIRONMENT=Production $DOTNET_PATH AoDaiNhaUyen.Api.dll
          EOF
          chmod +x /root/AoDaiNhaUyen/backend/start.sh

          cat > /root/AoDaiNhaUyen/frontend/start.sh << 'STARTEOF'
          #!/bin/bash
          cd /root/AoDaiNhaUyen/frontend/dist
          /root/.bun/bin/serve -s -l 3000 .
          STARTEOF
          chmod +x /root/AoDaiNhaUyen/frontend/start.sh

          cat > /root/AoDaiNhaUyen/frontend-admin/start.sh << 'STARTEOF'
          #!/bin/bash
          cd /root/AoDaiNhaUyen/frontend-admin/dist
          /root/.bun/bin/serve -s -l 3101 .
          STARTEOF
          chmod +x /root/AoDaiNhaUyen/frontend-admin/start.sh

          # ==========================================
          # 8. Restart PM2 Processes
          # ==========================================
          echo "[${SERVER_NAME}] Restarting PM2 processes..."
          /root/.bun/bin/pm2 delete aodai-api 2>/dev/null || true
          /root/.bun/bin/pm2 delete aodai-admin 2>/dev/null || true
          /root/.bun/bin/pm2 delete aodai-frontend 2>/dev/null || true

          /root/.bun/bin/pm2 start /root/AoDaiNhaUyen/backend/start.sh --name "aodai-api"
          /root/.bun/bin/pm2 start /root/AoDaiNhaUyen/frontend/start.sh --name "aodai-frontend"
          /root/.bun/bin/pm2 start /root/AoDaiNhaUyen/frontend-admin/start.sh --name "aodai-admin"

          /root/.bun/bin/pm2 save

          # ==========================================
          # 9. Cleanup
          # ==========================================
          echo "[${SERVER_NAME}] Cleaning up old backups..."
          cd /root/AoDaiNhaUyen/frontend
          ls -dt dist.backup.* 2>/dev/null | tail -n +4 | xargs rm -rf 2>/dev/null || true

          cd /root/AoDaiNhaUyen/backend
          rm -rf publish.backup 2>/dev/null || true

          echo "=== [${SERVER_NAME}] Deployment Completed Successfully ==="

          /root/.bun/bin/pm2 status
          REMOTE_SCRIPT
