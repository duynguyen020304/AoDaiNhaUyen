name: Deploy to Dev (SSH / Cloudflare Tunnel)

on:
  workflow_dispatch:
  push:
    branches:
      - master

env:
  INFISICAL_API_URL: https://infisical.shiphard.studio
  INFISICAL_PROJECT_ID: cd653fdf-37da-4872-a27c-4864d673b89a
  INFISICAL_ENVIRONMENT_SLUG: staging
  INFISICAL_SECRET_PATH: /

jobs:
  # ==========================================
  # Build Frontend for HK1
  # ==========================================
  build-frontend-hk1:
    runs-on: ubuntu-latest

    env:
      S3_ARTIFACT_PREFIX: artifacts/${{ github.event.repository.name }}/${{ github.ref_name }}/${{ github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fetch secrets from Infisical
        shell: bash
        env:
          INFISICAL_TOKEN: ${{ secrets.INFISICAL_TOKEN }}
        run: |
          set -euo pipefail
          case "${INFISICAL_ENVIRONMENT_SLUG}" in
            prod|production)
              echo "ERROR: deploy-dev.yml must not fetch production Infisical secrets"
              exit 1
              ;;
          esac
          echo "Fetching Infisical secrets from environment: ${INFISICAL_ENVIRONMENT_SLUG}"
          sudo apt-get update -qq && sudo apt-get install -y -qq jq >/dev/null 2>&1
          HTTP_CODE=$(curl -sS -w "%{http_code}" -o /tmp/infisical-secrets.json \
            --connect-timeout 15 --max-time 60 --retry 5 --retry-delay 10 \
            -H "Authorization: Bearer ${INFISICAL_TOKEN}" \
            "${INFISICAL_API_URL}/api/v3/secrets/raw?projectId=${INFISICAL_PROJECT_ID}&environment=${INFISICAL_ENVIRONMENT_SLUG}&secretPath=${INFISICAL_SECRET_PATH}")
          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "ERROR: Infisical API returned HTTP $HTTP_CODE"
            cat /tmp/infisical-secrets.json
            exit 1
          fi
          jq -r '.secrets[] | [.secretKey, .secretValue // ""] | @tsv' /tmp/infisical-secrets.json |
          while IFS=$'\t' read -r key value; do
            if [ -n "$value" ]; then
              echo "::add-mask::$value"
            fi
            {
              echo "${key}<<__INFISICAL_${key}__"
              echo "$value"
              echo "__INFISICAL_${key}__"
            } >> "$GITHUB_ENV"
          done
          echo "Secrets fetched: $(jq '.secrets | length' /tmp/infisical-secrets.json)"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install & Build Frontend
        run: |
          cd frontend
          bun install
          PUBLIC_BACKEND_DOMAIN="$HK1_PUBLIC_BACKEND_DOMAIN" \
          VITE_API_BASE_URL="$HK1_VITE_API_BASE_URL" \
          PUBLIC_GOOGLE_CLIENT_ID="$HK1_PUBLIC_GOOGLE_CLIENT_ID" \
          PUBLIC_ZALO_APP_ID="$HK1_ZALO_OAUTH_APP_ID" \
          PUBLIC_FACEBOOK_CLIENT_ID="${HK1_PUBLIC_FACEBOOK_CLIENT_ID:-}" \
          bun run build

      - name: Upload Frontend Artifact to S3
        run: |
          mkdir -p ~/.aws
          cat > ~/.aws/config << EOF
          [default]
          region = $S3_REGION
          s3 =
            addressing_style = path
          EOF
          tar -czf frontend-dist-hk1.tar.gz -C frontend/dist .
          AWS_ACCESS_KEY_ID="$S3_ACCESS_KEY" \
          AWS_SECRET_ACCESS_KEY="$S3_SECRET_KEY" \
          AWS_REGION="$S3_REGION" \
          AWS_ENDPOINT_URL="$S3_SERVICE_URL" \
          aws s3 cp frontend-dist-hk1.tar.gz "s3://$S3_BUCKET_NAME/$S3_ARTIFACT_PREFIX/frontend-dist-hk1.tar.gz"

  # ==========================================
  # Build Frontend for US1
  # ==========================================
