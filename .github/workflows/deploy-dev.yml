            --connect-timeout 15 --max-time 60 --retry 5 --retry-delay 10 \
            -H "Authorization: Bearer ${INFISICAL_TOKEN}" \
            "${INFISICAL_API_URL}/api/v3/secrets/raw?projectId=${INFISICAL_PROJECT_ID}&environment=${INFISICAL_ENVIRONMENT_SLUG}&secretPath=${INFISICAL_SECRET_PATH}")
          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "ERROR: Infisical API returned HTTP $HTTP_CODE"
            cat /tmp/infisical-secrets.json
            exit 1
          fi
          jq -r '.secrets[] | [.secretKey, .secretValue // ""] | @tsv' /tmp/infisical-secrets.json |
          while IFS=$'\t' read -r key value; do
            if [ -n "$value" ]; then
              echo "::add-mask::$value"
            fi
            {
              echo "${key}<<__INFISICAL_${key}__"
              echo "$value"
              echo "__INFISICAL_${key}__"
            } >> "$GITHUB_ENV"
          done
          echo "Secrets fetched: $(jq '.secrets | length' /tmp/infisical-secrets.json)"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install & Build Frontend
        run: |
          cd frontend
          bun install
          PUBLIC_BACKEND_DOMAIN="$US1_PUBLIC_BACKEND_DOMAIN" \
          VITE_API_BASE_URL="$US1_VITE_API_BASE_URL" \
          PUBLIC_GOOGLE_CLIENT_ID="$US1_PUBLIC_GOOGLE_CLIENT_ID" \
          PUBLIC_ZALO_APP_ID="$US1_ZALO_OAUTH_APP_ID" \
